<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>고객 관련 최신기사 · MISUMI</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="pv-app">

  <header class="pv-header">
    <div class="pv-header__top">
      <div class="pv-brand">
        <img src="assets/logo/misumi-logo-official-transparent.png" alt="MISUMI 로고" class="pv-logo" />
        <h1 class="pv-title">고객 관련 최신기사</h1>
      </div>
      <div class="pv-header__actions">
        <a class="hub-home-btn" href="https://misumi-sales-hub.sunyulbbuya.workers.dev/" aria-label="한국미스미 영업 허브로 이동">
          <svg class="hub-home-btn__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10.5V19a1 1 0 0 0 1 1H9.5a1 1 0 0 0 1-1v-3.5a1 1 0 0 1 1-1h1a1 1 0 0 1 1 1V19a1 1 0 0 0 1 1H17.5a1 1 0 0 0 1-1v-8.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span class="hub-home-btn__label">영업 허브</span>
        </a>
        <div class="pv-status-block">
          <p class="pv-status" id="pvStatus" role="status" aria-live="polite">
            <span class="pv-status__dot" id="pvStatusDot"></span>
            <span id="pvStatusText">업데이트 정보 확인 중…</span>
          </p>
          <p class="pv-counts" id="pvCounts"></p>
        </div>
      </div>
    </div>

    <div class="pv-search-wrap">
      <svg class="pv-search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input type="search" id="pvSearchInput" class="pv-search-input" placeholder="담당자 또는 고객사를 검색하세요" autocomplete="off" aria-label="담당자 또는 고객사 검색" />
      <div id="pvAutocomplete" class="pv-autocomplete" hidden role="listbox"></div>
    </div>

    <div class="pv-filter-row" id="pvFilterRow">
      <label class="sr-only" for="pvTeamSelect">팀</label>
      <select id="pvTeamSelect" class="pv-chip-select"></select>
      <label class="sr-only" for="pvCellSelect">셀</label>
      <select id="pvCellSelect" class="pv-chip-select"></select>
      <label class="sr-only" for="pvRepSelect">영업명</label>
      <select id="pvRepSelect" class="pv-chip-select"></select>
      <button type="button" id="pvResetBtn" class="pv-reset-link">필터 전체 해제</button>
    </div>

    <div class="pv-secondary-panel" id="pvSecondaryPanel">
      <div class="pv-secondary-panel__handle" id="pvSheetHandle" aria-hidden="true"></div>
      <div class="pv-secondary-panel__header">
        <span>이슈 유형 · 메이저 언론사</span>
        <button type="button" id="pvSheetCloseBtn" class="pv-sheet-close" aria-label="닫기">✕</button>
      </div>
      <div class="pv-secondary-panel__body">
        <div class="pv-sheet-group">
          <span class="pv-sheet-label">이슈 유형</span>
          <div id="pvTagChips" class="pv-chip-row"></div>
        </div>
        <label class="pv-major-toggle">
          <input type="checkbox" id="pvMajorOnly" /> 메이저 언론사만 보기
        </label>
        <button type="button" id="pvSheetResetBtn" class="pv-panel-reset-link">필터 전체 해제</button>
      </div>
    </div>
  </header>

  <main class="pv-main">
    <aside class="pv-side" id="pvSide" aria-label="담당 고객 목록">
      <h2 class="pv-side__title">담당 고객<span class="pv-side__count" id="pvSideCount"></span></h2>
      <div id="pvCompanyList" class="pv-company-list"></div>
    </aside>

    <section class="pv-feed">
      <h2 class="pv-feed__title" id="pvFeedTitle">고객 실시간 이슈</h2>
      <div id="pvArticleList" class="pv-article-list" aria-live="polite"></div>
      <p id="pvEmptyState" class="pv-empty" hidden></p>
      <p id="pvErrorState" class="pv-error" hidden></p>
      <div class="pv-load-more-wrap">
        <button type="button" id="pvLoadMoreBtn" class="pv-load-more-btn" hidden>더보기</button>
      </div>
    </section>
  </main>

</div>

<div class="pv-sheet-backdrop" id="pvSheetBackdrop" hidden></div>

<div class="pv-bottom-bar" id="pvBottomBar">
  <button type="button" id="pvOpenSheetBtn" class="pv-bottom-filter-btn">
    필터 <span id="pvFilterCountBadge" class="pv-badge" hidden>0</span>
  </button>
</div>

<button type="button" id="pvTopBtn" class="pv-top-btn" aria-label="맨 위로 이동" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true" class="pv-top-btn__arrow"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span class="pv-top-btn__label">TOP</span>
</button>

<div class="pv-company-modal-backdrop" id="pvCompanyModalBackdrop" hidden></div>

<div class="pv-company-modal" id="pvCompanyModal" hidden role="dialog" aria-modal="true" aria-labelledby="pvCompanyModalTitle">
  <div class="pv-company-modal__header">
    <div class="pv-company-modal__heading">
      <h3 id="pvCompanyModalTitle" class="pv-company-modal__title"></h3>
      <p id="pvCompanyModalMeta" class="pv-company-modal__meta"></p>
    </div>
    <button type="button" id="pvCompanyModalCloseBtn" class="pv-company-modal__close" aria-label="닫기">✕</button>
  </div>
  <div id="pvCompanyModalBody" class="pv-company-modal__body"></div>
  <div class="pv-company-modal__footer">
    <button type="button" id="pvCompanyModalViewAllBtn" class="pv-company-modal__viewall">이 고객사 기사 전체 보기</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
